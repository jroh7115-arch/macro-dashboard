name: Diagnose Korean API reachability (temporary)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Probe KOSIS / customs endpoints from GitHub Actions IP
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
        run: python diagnose_kr_apis.py
