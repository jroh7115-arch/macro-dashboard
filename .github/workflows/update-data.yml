name: Update macro dashboard data

on:
  schedule:
    # 소스별로 값이 올라오는 시각이 달라 세 번으로 나눈다.
    #
    # 미국 증시(S&P500·나스닥·SOX)는 야후에서 받는데 마감 직후 종가가 들어온다.
    # 마감은 16:00 ET = KST 05:00(겨울 06:00)이므로 07:00 실행이면 당일 종가를 잡는다.
    # FRED판은 훨씬 늦어서(나스닥이 미 중부 22:38 = KST 12:38) 예비로만 남겨뒀다.
    #
    # 반면 미국 국채금리·VIX·환율·하이일드는 FRED에만 있고 '다음 영업일'에 올라온다.
    # 가장 늦은 국채금리가 미 중부 15:16 = UTC 20:16(겨울 21:16)이라 22:00 실행이 받는다.
    #
    # 한국 증시·수급·VKOSPI는 KOSPI 마감(15:30) 이후라야 하므로 16:00에 받는다.
    - cron: '0 22 * * *'   # KST 07:00 - 미국 증시 당일 종가 + 전일 금리·VIX·환율
    - cron: '30 5 * * *'   # KST 14:30 - 예비(앞선 실행이 지연·실패했을 때 보완)
    - cron: '0 7 * * *'    # KST 16:00 - 한국 증시 마감 후(KOSPI·수급·VKOSPI)
  workflow_dispatch:
    inputs:
      backfill:
        description: '품목 분류 재수집 개월 수 (기준 변경 직후 몰아받기용)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # holidays는 버전에 따라 한국 공휴일 판정이 달라진다(예: 0.101+는 근로자의 날을
        # 추가해 2026-05 조업일수가 19일에서 18일로 바뀜). 기존 1일평균 수출액 시리즈
        # 전체가 0.100 기준으로 계산돼 있어, 버전을 고정해야 단차가 생기지 않는다.
        run: pip install requests yfinance pandas pdfplumber 'holidays==0.100'

      - name: Run data fetch script (FRED + yfinance + customs export data)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
          BACKFILL_PER_RUN: ${{ inputs.backfill }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python fetch_macro_data_github.py

      - name: Commit and push data.js if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Auto-update macro dashboard data"
          git push
