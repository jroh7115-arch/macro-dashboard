name: Update macro dashboard data

on:
  schedule:
    # FRED는 시리즈마다 갱신 시각이 크게 다르다(미 중부시간 기준으로 조회한 값).
    #   S&P500      당일 19:02 -> UTC 00:02
    #   나스닥       당일 22:38 -> UTC 03:38
    #   VIX         다음 영업일 08:38 -> UTC 13:38
    #   하이일드      다음 영업일 10:12 -> UTC 15:12
    #   국채금리·환율  다음 영업일 15:16 -> UTC 20:16
    # 그래서 한 번만 돌리면 어느 한쪽은 항상 하루 늦는다. 셋으로 나눠 각각을 잡는다.
    # (겨울 표준시에는 UTC 기준 1시간씩 밀리므로 여유를 두고 잡았다)
    # 미국장은 KST 05시(겨울 06시)에 끝나지만 FRED 반영은 그보다 한참 뒤다.
    # 나스닥이 가장 늦어(중부시간 22:38) 겨울에는 UTC 04:38이라, 04:30에 돌리면
    # 8분 차이로 놓친다. 05:30으로 두면 여름 112분·겨울 52분 여유가 생긴다.
    - cron: '30 5 * * *'   # KST 14:30 - 전일 미국 증시 종가가 FRED에 올라온 뒤
    - cron: '0 7 * * *'    # KST 16:00 - 한국 증시 마감 후(KOSPI·수급·VKOSPI)
    - cron: '0 22 * * *'   # KST 07:00 - 미국 국채금리·VIX·환율·하이일드 확보
  workflow_dispatch:
    inputs:
      backfill:
        description: '품목 분류 재수집 개월 수 (기준 변경 직후 몰아받기용)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # holidays는 버전에 따라 한국 공휴일 판정이 달라진다(예: 0.101+는 근로자의 날을
        # 추가해 2026-05 조업일수가 19일에서 18일로 바뀜). 기존 1일평균 수출액 시리즈
        # 전체가 0.100 기준으로 계산돼 있어, 버전을 고정해야 단차가 생기지 않는다.
        run: pip install requests yfinance pandas pdfplumber 'holidays==0.100'

      - name: Run data fetch script (FRED + yfinance + customs export data)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
          BACKFILL_PER_RUN: ${{ inputs.backfill }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python fetch_macro_data_github.py

      - name: Commit and push data.js if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Auto-update macro dashboard data"
          git push
