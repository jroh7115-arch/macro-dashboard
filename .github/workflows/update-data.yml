name: Update macro dashboard data

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '품목 분류 재수집 개월 수 (기준 변경 직후 몰아받기용)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # holidays는 버전에 따라 한국 공휴일 판정이 달라진다(예: 0.101+는 근로자의 날을
        # 추가해 2026-05 조업일수가 19일에서 18일로 바뀜). 기존 1일평균 수출액 시리즈
        # 전체가 0.100 기준으로 계산돼 있어, 버전을 고정해야 단차가 생기지 않는다.
        run: pip install requests yfinance pandas pdfplumber 'holidays==0.100'

      - name: Run data fetch script (FRED + yfinance + customs export data)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
          BACKFILL_PER_RUN: ${{ inputs.backfill }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python fetch_macro_data_github.py

      - name: Commit and push data.js if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Auto-update macro dashboard data"
          git push
